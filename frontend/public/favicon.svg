<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Doosan Bobcat style - bold geometric bobcat face -->
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#E8531E"/>
  <!-- Left ear -->
  <polygon points="10,30 14,4 24,24" fill="white"/>
  <!-- Right ear -->
  <polygon points="54,30 50,4 40,24" fill="white"/>
  <!-- Head shape -->
  <ellipse cx="32" cy="38" rx="20" ry="18" fill="white"/>
  <!-- Left eye -->
  <polygon points="20,32 26,29 28,34 24,37 19,35" fill="#E8531E"/>
  <!-- Right eye -->
  <polygon points="44,32 38,29 36,34 40,37 45,35" fill="#E8531E"/>
  <!-- Nose -->
  <polygon points="30,40 32,38 34,40 32,43" fill="#E8531E"/>
  <!-- Mouth line -->
  <path d="M32 43 L32 45" stroke="#E8531E" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M27 46 Q32 49 37 46" fill="none" stroke="#E8531E" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Forehead marking - V shape -->
  <path d="M25 26 L32 22 L39 26" fill="none" stroke="#E8531E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cheek tufts -->
  <path d="M12 38 L8 40 L12 42" fill="white" stroke="white" stroke-width="1"/>
  <path d="M52 38 L56 40 L52 42" fill="white" stroke="white" stroke-width="1"/>
</svg>
