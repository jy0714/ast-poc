services:
  # === Backend API ===
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - INDEX_DIR=/app/data/index
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      - ast-network

  # === Frontend (nginx) ===
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ast-network

  # === Ollama (GPU) ===
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # v4: 모델을 내리지 않고(실험·서비스 응답 시간), 임베딩 + LLM 동시 적재
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_MAX_LOADED_MODELS=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - ast-network

volumes:
  ollama-models:

networks:
  ast-network:
    driver: bridge
