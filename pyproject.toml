[project]
name = "ast-poc"
version = "0.1.0"
description = "Audit Support Tool - Local RAG system for PST/Documents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Private"}

dependencies = [
    # === PST Parsing (optional — requires C++ build tools) ===
    # "libpff-python>=20231205",

    # === Document Parsing ===
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.2",
    "xlrd>=2.0.1",  # v4: 레거시 XLS 첨부
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.10.0",  # OCR 이미지 전처리 (deskew/denoise/contrast)
    "langdetect>=1.0.9",
    "extract-msg>=0.48.0",

    # === LLM & RAG ===
    "langchain-ollama>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "ollama>=0.3.0",
    "openai>=1.40.0",

    # === API ===
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",

    # === Database ===
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",

    # === Korean NLP / 다국어 ===
    "kiwipiepy>=0.18.0",
    "lingua-language-detector>=2.0.0",  # v4: 단위별 언어 감지 (langdetect 대체)
    "tokenizers>=0.19.0",  # v4: Qwen3 토크나이저 토큰 수

    # === Reranker ===
    # torch는 CUDA 빌드를 별도 설치한다 (docs/guides/offline-models.md 참고)
    # pip install torch --index-url https://download.pytorch.org/whl/cu126
    "torch>=2.4.0",
    "transformers>=4.51.0",  # v4: Qwen3-Reranker
    "FlagEmbedding>=1.2.0",  # bge 백엔드 (R9 비교 전용)

    # === Utilities ===
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "httpx>=0.27.0",
    "xlwt>=1.3.0",  # 테스트: 레거시 XLS 생성
]
# v4 실험 하네스 (experiments_v4/)
experiments = [
    "ranx>=0.3.20",
    "pyyaml>=6.0",
]
# 한국어 OCR 정확도 95%+ — paddleocr는 4GB+ 의존성이라 기본 install 제외.
# pip install -e .[ocr-paddle]  또는 pip install paddleocr paddlepaddle 후
# settings.ocr_engine="auto"|"paddle" 로 활성화.
ocr-paddle = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.6.0",  # GPU 환경은 paddlepaddle-gpu로 별도 설치
]
# 정확한 토큰 카운트 (OpenAI 계열 cl100k_base). 미설치 시 문자 기반 추정으로 동작.
# pip install -e .[tokencount]
tokencount = [
    "tiktoken>=0.7.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
